<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pentix share card</title>
    <style>
      @page { margin: 0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #08090b;
        color: #eef2f8;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(120% 100% at 20% 0%, #000 30%, transparent 78%);
        -webkit-mask-image: radial-gradient(120% 100% at 20% 0%, #000 30%, transparent 78%);
      }
      .glow {
        position: absolute;
        width: 720px;
        height: 720px;
        left: -140px;
        top: -220px;
        background: radial-gradient(closest-side, rgba(91, 124, 255, 0.3), rgba(139, 92, 246, 0.12) 55%, transparent);
        filter: blur(6px);
      }
      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 64px;
        height: 100%;
        padding: 0 92px;
      }
      .mark { filter: drop-shadow(0 28px 48px rgba(91, 124, 255, 0.32)); }
      .copy { min-width: 0; }
      .word {
        font-size: 108px;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 0.92;
        margin: 0;
      }
      .word span {
        background: linear-gradient(92deg, #6ea8ff, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8f9bb0;
        margin-bottom: 22px;
      }
      .dot { width: 9px; height: 9px; border-radius: 99px; background: #5b7cff; }
      .tagline {
        margin: 26px 0 0;
        font-size: 30px;
        line-height: 1.3;
        font-weight: 500;
        color: #b9c2d2;
        max-width: 560px;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
      .chip {
        font-size: 17px;
        font-weight: 600;
        color: #cfd6e3;
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 99px;
        padding: 9px 18px;
      }
      .foot {
        position: absolute;
        left: 92px;
        right: 92px;
        bottom: 34px;
        display: flex;
        justify-content: space-between;
        font-size: 16px;
        letter-spacing: 0.06em;
        color: #6d7787;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="card">
      <svg class="mark" width="330" height="330" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#6EA8FF" />
            <stop offset="0.52" stop-color="#5B7CFF" />
            <stop offset="1" stop-color="#8B5CF6" />
          </linearGradient>
          <linearGradient id="gloss" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.4" />
            <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.07" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#151821" />
            <stop offset="1" stop-color="#08090b" />
          </linearGradient>
          <path id="p" d="M92 138H219C282 138 300 176 300 219C300 262 282 300 219 300H150V396H92Z M150 182H219C246 182 256 199 256 219C256 239 246 256 219 256H150Z" />
          <path id="x" transform="rotate(45 380 325)" d="M406 299L406 245L460 299L460 351L406 351L406 405L354 405L354 351L300 351L300 299L354 299L354 245Z" />
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#plate)" />
        <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.07" />
        <g fill="url(#body)" fill-rule="evenodd">
          <use href="#p" />
          <use href="#x" />
        </g>
        <g fill="url(#gloss)" fill-rule="evenodd">
          <use href="#p" />
          <use href="#x" />
        </g>
      </svg>
      <div class="copy">
        <div class="kicker"><span class="dot"></span> Vector logo studio</div>
        <h1 class="word">Pentix<span>.</span></h1>
        <p class="tagline">Draw real logos on your phone: pen tool, shape builder and pathfinder under your thumbs.</p>
        <div class="chips">
          <span class="chip">Pen &amp; curves</span>
          <span class="chip">Shape builder</span>
          <span class="chip">Live finishes</span>
          <span class="chip">Works offline</span>
        </div>
      </div>
    </div>
    <div class="foot">
      <span>PX MONOGRAM</span>
      <span>LOCAL-FIRST · NO ACCOUNT NEEDED</span>
    </div>
  </body>
</html>
